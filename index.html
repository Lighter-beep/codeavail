<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAvail | Premium Dev Library</title>
    
    <link rel="icon" type="image/png" href="png.png">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css">
</head>

<body>
   <div id="loader-wrapper">
    <div class="loader-content">
        <div class="typewriter-text">
            <span>C</span><span>O</span><span>D</span><span>E</span><span>A</span><span>V</span><span>A</span><span>I</span><span>L</span>
        </div>
        <div class="progress-container">
            <div class="progress-line"></div>
        </div>
    </div>
</div>
    <div class="container">

       <header>
    <div class="top-corner">
        <button id="themeToggle">LIGHT MODE</button>
    </div>

    <div class="terminal-loader">
        <img src="png.png" alt="Logo" class="logo-img">
        <h1>CodeAvail</h1>
    </div>
</header>

        <div class="nav-container">
            <input type="text" id="searchBar" placeholder="Search snippets..." aria-label="Search Snippets">
            <div class="tabs">
                <button class="tab-btn active" data-cat="all">All Library</button>
                <button class="tab-btn" data-cat="Python">Python</button>
                <button class="tab-btn" data-cat="JavaScript">JavaScript</button>
                <button class="tab-btn" data-cat="Web">HTML/CSS</button>
            </div>
        </div>

        <div id="snippetList">
          
        </div>

        <div class="card" style="border-style: dashed; border-color: var(--accent); margin-top: 50px;">
            <span class="lang-tag">Community</span>
            <h3>Submit a Snippet</h3>
            <p>Contribute your logic to the CodeAvail library.</p>
            
            <form action="https://formspree.io/f/xkovndyj" method="POST" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
                <input type="text" name="title" placeholder="Snippet Title" required 
                    style="padding: 12px; background: #1c2128; border: 1px solid var(--border); color: white; border-radius: 8px;">
                
                <textarea name="code" placeholder="Paste your code here..." required 
                    style="padding: 12px; background: #1c2128; border: 1px solid var(--border); color: white; border-radius: 8px; min-height: 120px; font-family: monospace;"></textarea>
                
                <button type="submit" 
                    style="background: var(--accent); color: black; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;">
                    Upload to Library
                </button>
            </form>
        </div>

        <footer>
            &copy; 2026 CodeAvail &bull; Engineered by Maheen Touseef.
        </footer>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
